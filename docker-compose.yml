services:
  minio:
    image: elestio/minio
    command: server /data --console-address ":9001"
    ports: 
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: 
      - ${VOLUMES_PATH}
  
  weekly-lakehouse-pipeline:
    build: .
    depends_on:
      - minio
    env_file: .env